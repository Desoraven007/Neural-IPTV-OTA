name: Publish Neural IPTV 1.0.1 BLD-002

on:
  push:
    branches: [main]
    paths:
      - "publish/bld002.ready"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout OTA repository
        uses: actions/checkout@v4

      - name: Download validated BLD-002 artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fL --retry 5 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-7fec-8210-9987-a4ff53cbafec/raw?se=2026-09-30T09%3A34%3A10Z&sp=r&sv=2026-02-06&sr=b&scid=86710107-4fa9-563c-be5e-3ab07fb7ef0c&skoid=3804227d-1b52-417d-afd9-9ffbb50fa53e&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-30T09%3A02%3A22Z&ske=2026-10-01T09%3A02%3A22Z&sks=b&skv=2026-02-06&sig=MIhixCSnYFbbGlFmnqmjd2Gxm8Fyo9gJWhGLkGPVbhI%3D' -o artifact.zip
          rm -rf artifact
          mkdir artifact
          unzip -q artifact.zip -d artifact
          test -s artifact/NeuralIPTVPlayer.nup
          test -s artifact/NeuralIPTVPlayer.nro
          test -s artifact/NeuralIPTVUpdater.nro
          test -s artifact/manifest.json
          test -s artifact/build-result.json

      - name: Normalize and validate BLD-002 manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          root=Path("artifact")
          mp=root/"manifest.json"
          rp=root/"build-result.json"
          nro=root/"NeuralIPTVPlayer.nro"
          nup=root/"NeuralIPTVPlayer.nup"
          updater=root/"NeuralIPTVUpdater.nro"

          m=json.loads(mp.read_text(encoding="utf-8"))
          r=json.loads(rp.read_text(encoding="utf-8"))

          assert m["version"]=="1.0.1"
          assert m["build_id"]=="BLD-002"
          assert m["update_epoch"]==1
          assert m["update_seq"]==2
          assert m["encrypted"] is True
          assert m["encryption"]=="CHACHA20-HMAC-SHA256-v1"
          assert m["public"] is True
          assert m["auth_required"] is False

          nb=nro.read_bytes()
          pb=nup.read_bytes()
          ub=updater.read_bytes()

          assert len(nb)>=20 and nb[16:20]==b"NRO0"
          assert len(ub)>=20 and ub[16:20]==b"NRO0"
          assert hashlib.sha256(nb).hexdigest()==m["sha256"]
          assert len(nb)==m["size"]
          assert hashlib.sha256(pb).hexdigest()==m["package_sha256"]
          assert len(pb)==m["package_size"]
          assert hashlib.sha256(ub).hexdigest()==m["updater_sha256"]
          assert len(ub)==m["updater_size"]
          assert r["sha256"]==m["sha256"]
          assert r["package_sha256"]==m["package_sha256"]

          m["package_url"]="https://github.com/Desoraven007/Neural-IPTV-OTA/releases/download/beta-1.0.1/NeuralIPTVPlayer.nup"
          m["next_manifest_url"]="https://raw.githubusercontent.com/Desoraven007/Neural-IPTV-OTA/main/manifest.json"
          m["updater_url"]="https://github.com/Desoraven007/Neural-IPTV-OTA/releases/download/beta-1.0.1/NeuralIPTVUpdater.nro"
          mp.write_text(json.dumps(m,indent=2)+"\n",encoding="utf-8")
          print("BLD-002 VALIDATED")
          PY

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          TAG="beta-1.0.1"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG"               artifact/NeuralIPTVPlayer.nup               artifact/NeuralIPTVPlayer.nro               artifact/NeuralIPTVUpdater.nro               artifact/manifest.json               --clobber
          else
            gh release create "$TAG"               artifact/NeuralIPTVPlayer.nup               artifact/NeuralIPTVPlayer.nro               artifact/NeuralIPTVUpdater.nro               artifact/manifest.json               --title "Neural IPTV 1.0.1 Beta / BLD-002"               --notes "V1 BLD-002: deteção automática do JSON OAuth Google por conteúdo. O nome do ficheiro deixa de importar. Primeira atualização V1 destinada ao teste real do Neural Updater."               --prerelease
          fi

      - name: Promote public manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          cp artifact/manifest.json manifest.json
          python3 - <<'PY'
          from pathlib import Path
          p=Path("CHANGELOG.md")
          old=p.read_text(encoding="utf-8") if p.exists() else "# Neural IPTV OTA\n"
          heading="## 1.0.1 / BLD-002 Beta"
          entry="\n## 1.0.1 / BLD-002 Beta\n- Google OAuth: deteção automática de JSON válido por conteúdo, independentemente do nome.\n- Pasta preferida: /switch/neural-iptv-player/google/.\n- Também aceita JSON diretamente em /switch/neural-iptv-player/.\n- Remove a introdução manual de Client ID e Client Secret na Switch.\n- update_seq 2; update_epoch 1.\n"
          if heading not in old:
              p.write_text(old.rstrip()+"\n"+entry+"\n",encoding="utf-8")
          PY

          git config user.name "Neural IPTV Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add manifest.json CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "Publish Neural IPTV 1.0.1 BLD-002 OTA"
            git push
          fi

      - name: Verify public OTA
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL --retry 5             https://raw.githubusercontent.com/Desoraven007/Neural-IPTV-OTA/main/manifest.json             -o verified-manifest.json
          python3 - <<'PY'
          import json
          m=json.load(open("verified-manifest.json"))
          assert m["version"]=="1.0.1"
          assert m["build_id"]=="BLD-002"
          assert m["update_seq"]==2
          assert m["update_epoch"]==1
          print("PUBLIC MANIFEST PASS")
          PY
          URL="$(python3 -c 'import json; print(json.load(open("verified-manifest.json"))["package_url"])')"
          curl -fLIsS --retry 5 "$URL" >/dev/null
          echo "PUBLIC PACKAGE PASS"
