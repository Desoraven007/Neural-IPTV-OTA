name: Bootstrap BLD-038 Beta OTA

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-bld038-beta.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch validated private artifact
        env:
          ARTIFACT_URL_B64: ""
        shell: bash
        run: |
          set -Eeuo pipefail
          URL="$(printf '%s' "$ARTIFACT_URL_B64" | base64 -d)"
          curl -fL --retry 3 "$URL" -o bld038.zip
          mkdir artifact
          unzip -q bld038.zip -d artifact
      - name: Validate and publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path("artifact")
          nro=(p/"NeuralIPTVPlayer.nro").read_bytes()
          nup=(p/"NeuralIPTVPlayer.nup").read_bytes()
          m=json.loads((p/"manifest.json").read_text())
          assert (m["version"],m["build_id"],m["channel"])==("7.0.22","BLD-038","Beta")
          assert m["public"] is True and m["auth_required"] is False and m["encrypted"] is True
          assert hashlib.sha256(nro).hexdigest()==m["sha256"] and len(nro)==m["size"]
          assert hashlib.sha256(nup).hexdigest()==m["package_sha256"] and len(nup)==m["package_size"]
          assert nro[16:20]==b"NRO0"
          PY
          TAG="beta-7.0.22"
          gh release create "$TAG" artifact/NeuralIPTVPlayer.nup artifact/manifest.json             --title "Neural IPTV 7.0.22 / BLD-038 Beta"             --notes "Google Drive OAuth reorganizado em 3 passos claros. Mantém o fix OTA da BLD-037 e o Dev Eye Sentinela."             --prerelease
          cp artifact/manifest.json manifest.json
          python3 - <<'PY'
          from pathlib import Path
          p=Path("CHANGELOG.md")
          old=p.read_text(encoding="utf-8") if p.exists() else "# Neural IPTV OTA\n"
          marker="## 7.0.22 / BLD-038 Beta"
          if marker not in old:
              old += "\n"+marker+"\n- Google Drive OAuth em 3 passos: credenciais, código Google, concluir ligação.\n- Mantém fix de loop OTA BLD-037 e Dev Eye Sentinela.\n"
              p.write_text(old,encoding="utf-8")
          PY
          git config user.name "Neural IPTV Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add manifest.json CHANGELOG.md
          git commit -m "Publish Neural IPTV 7.0.22 BLD-038 Beta"
          git push
      - name: Verify public OTA
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL --retry 3 https://raw.githubusercontent.com/Desoraven007/Neural-IPTV-OTA/main/manifest.json -o check.json
          python3 - <<'PY'
          import json
          m=json.load(open("check.json"))
          assert (m["version"],m["build_id"],m["channel"])==("7.0.22","BLD-038","Beta")
          PY
          URL="$(python3 -c 'import json;print(json.load(open("check.json"))["package_url"])')"
          curl -fLIsS --retry 3 "$URL" >/dev/null
