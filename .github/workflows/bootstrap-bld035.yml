name: Bootstrap BLD-035 OTA

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-bld035.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download validated BLD-035 artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fL --retry 3 'https://sdmntprukwest.oaiusercontent.com/files/00000000-7bcc-8243-8524-48e072bfa16f/raw?se=2026-09-29T22%3A00%3A00Z&sp=r&sv=2026-02-06&sr=b&scid=c1440e68-17ae-58fa-9341-8ed647e06216&skoid=3804227d-1b52-417d-afd9-9ffbb50fa53e&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T06%3A42%3A15Z&ske=2026-09-30T06%3A42%3A15Z&sks=b&skv=2026-02-06&sig=zu8FSc97m6JovKJV96fkFMC%2B6zigY9whew4zxeX29pQ%3D' -o bld035.zip
          mkdir artifact
          unzip -q bld035.zip -d artifact
          ls -lah artifact

      - name: Validate BLD-035 payload
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("artifact")
          nro=(root/"NeuralIPTVPlayer.nro").read_bytes()
          nup=(root/"NeuralIPTVPlayer.nup").read_bytes()
          m=json.loads((root/"manifest.json").read_text())
          r=json.loads((root/"build-result.json").read_text())
          assert m["version"]=="7.0.19"
          assert m["build_id"]=="BLD-035"
          assert r["version"]=="7.0.19" and r["build_id"]=="BLD-035"
          assert m["encrypted"] is True
          assert m["public"] is True
          assert m["auth_required"] is False
          assert hashlib.sha256(nup).hexdigest()==m["package_sha256"]
          assert len(nup)==m["package_size"]
          assert hashlib.sha256(nro).hexdigest()==m["sha256"]
          assert len(nro)==m["size"]
          assert nro[16:20]==b"NRO0"
          print("BLD-035 payload PASS")
          PY

      - name: Publish encrypted release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          TAG="canary-7.0.19"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifact/NeuralIPTVPlayer.nup artifact/manifest.json --clobber
          else
            gh release create "$TAG" artifact/NeuralIPTVPlayer.nup artifact/manifest.json \
              --title "Neural IPTV 7.0.19 / BLD-035 Canary" \
              --notes "Reports DEV + Dev Eye passam para Google Drive. OTA público cifrado mantém-se no GitHub." \
              --prerelease
          fi

      - name: Promote manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          cp artifact/manifest.json manifest.json
          python3 - <<'PY'
          from pathlib import Path
          p=Path("CHANGELOG.md")
          old=p.read_text(encoding="utf-8") if p.exists() else "# Neural IPTV OTA\n"
          marker="## 7.0.19 / BLD-035 Canary"
          entry="""\n## 7.0.19 / BLD-035 Canary
          - Reports DEV + Dev Eye passam para Google Drive.
          - OTA continua público no GitHub com pacote cifrado.
          - Sem token GitHub na app para atualizar.
          """
          if marker not in old:
              p.write_text(old.rstrip()+entry+"\n",encoding="utf-8")
          PY
          git config user.name "Neural IPTV Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add manifest.json CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "Publish Neural IPTV 7.0.19 BLD-035"
            git push
          fi

      - name: Verify public OTA
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL --retry 3 https://raw.githubusercontent.com/Desoraven007/Neural-IPTV-OTA/main/manifest.json -o check.json
          python3 - <<'PY'
          import json
          m=json.load(open("check.json"))
          assert m["version"]=="7.0.19"
          assert m["build_id"]=="BLD-035"
          assert m["public"] is True and m["auth_required"] is False
          print("PUBLIC OTA BLD-035 PASS")
          PY
          URL="$(python3 -c 'import json; print(json.load(open("check.json"))["package_url"])')"
          curl -fLIsS --retry 3 "$URL" >/dev/null
          echo "PUBLIC PACKAGE PASS"
