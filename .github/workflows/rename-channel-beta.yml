name: Rename Neural IPTV Channel To Beta

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rename-channel-beta.yml"

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - name: Rename current public release title
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh release edit canary-7.0.19             --repo Desoraven007/Neural-IPTV-OTA             --title "Neural IPTV 7.0.19 / BLD-035 Beta"
