name: Bootstrap BLD-034 Public Encrypted OTA

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-bld034.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch validated BLD-034 artifact snapshot
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fL --retry 3 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-3108-81f4-b06c-6e02c567ac88/raw?se=2026-09-29T19%3A49%3A04Z&sp=r&sv=2026-02-06&sr=b&scid=63309a51-70ac-5006-8fea-eb0cf6d78209&skoid=3804227d-1b52-417d-afd9-9ffbb50fa53e&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T05%3A56%3A06Z&ske=2026-09-30T05%3A56%3A06Z&sks=b&skv=2026-02-06&sig=c6nsP2N8GfY13uUrciD8irjGh99c7Ij8slQvfTpYl6g%3D' -o /tmp/NeuralIPTV-BLD-034.zip
          echo "694dce570776856980167206f13e9b95ad89b208f36fa62a29aef90d8a4f1196  /tmp/NeuralIPTV-BLD-034.zip" | sha256sum -c -
          rm -rf /tmp/bld034
          mkdir -p /tmp/bld034
          unzip -q /tmp/NeuralIPTV-BLD-034.zip -d /tmp/bld034

      - name: Verify encrypted payload and publish GitHub-only files
        shell: bash
        run: |
          set -Eeuo pipefail
          NRO=/tmp/bld034/NeuralIPTVPlayer.nro
          NUP=/tmp/bld034/NeuralIPTVPlayer.nup
          SRC_MANIFEST=/tmp/bld034/manifest.json

          test -s "$NRO"
          test -s "$NUP"
          test "$(stat -c %s "$NRO")" = "37731950"
          test "$(stat -c %s "$NUP")" = "37732010"
          test "$(sha256sum "$NRO" | cut -d ' ' -f1)" = "bb8db3836e783bdc1237c41732b1d96502a51c1bae119f1c2c2d577ffc78899f"
          test "$(sha256sum "$NUP" | cut -d ' ' -f1)" = "678e810a078ad25c889e97f2d3ed1dfc87c02392832fca09e921778c959b80af"
          test "$(dd if="$NRO" bs=1 skip=16 count=4 2>/dev/null)" = "NRO0"

          mkdir -p releases/canary-7.0.18
          cp "$NUP" releases/canary-7.0.18/NeuralIPTVPlayer.nup

          python3 - <<'PY'
          import json, hashlib
          from pathlib import Path
          src=Path("/tmp/bld034/manifest.json")
          m=json.loads(src.read_text())
          assert m["version"]=="7.0.18"
          assert m["build_id"]=="BLD-034"
          assert m["encrypted"] is True
          assert m["package_sha256"]=="678e810a078ad25c889e97f2d3ed1dfc87c02392832fca09e921778c959b80af"
          assert m["sha256"]=="bb8db3836e783bdc1237c41732b1d96502a51c1bae119f1c2c2d577ffc78899f"
          m["package_url"]="https://raw.githubusercontent.com/Desoraven007/Neural-IPTV-OTA/main/releases/canary-7.0.18/NeuralIPTVPlayer.nup"
          m["next_manifest_url"]="https://raw.githubusercontent.com/Desoraven007/Neural-IPTV-OTA/main/manifest.json"
          m["public"]=True
          m["auth_required"]=False
          Path("manifest.json").write_text(json.dumps(m, indent=2)+"\n", encoding="utf-8")
          PY

          cat > CHANGELOG.md <<'EOF'
          # Neural IPTV OTA

          ## 7.0.18 / BLD-034 Canary
          - OTA público alojado exclusivamente no GitHub.
          - NeuralIPTVPlayer.nup cifrado.
          - Sem token/PAT necessário na app para verificar ou descarregar atualizações.
          - Validação do pacote cifrado por SHA-256 e tamanho.
          - Desencriptação local e nova validação do NRO por SHA-256, tamanho e NRO0.
          - Backup verificado e instalação transacional.
          - Código-fonte permanece no repositório privado.
          EOF

          git config user.name "Neural IPTV Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add manifest.json CHANGELOG.md releases/canary-7.0.18/NeuralIPTVPlayer.nup
          git commit -m "Publish Neural IPTV 7.0.18 BLD-034 encrypted OTA"
          git push

      - name: Verify anonymous GitHub URLs
        shell: bash
        run: |
          set -Eeuo pipefail
          sleep 2
          curl -fsSL --retry 3 https://raw.githubusercontent.com/Desoraven007/Neural-IPTV-OTA/main/manifest.json -o /tmp/public-manifest.json
          python3 - <<'PY'
          import json
          m=json.load(open("/tmp/public-manifest.json"))
          assert m["version"]=="7.0.18"
          assert m["build_id"]=="BLD-034"
          assert m["encrypted"] is True
          assert m["auth_required"] is False
          assert m["package_url"].startswith("https://raw.githubusercontent.com/Desoraven007/Neural-IPTV-OTA/")
          print("Public anonymous manifest PASS")
          PY
          curl -fLIsS --retry 3 https://raw.githubusercontent.com/Desoraven007/Neural-IPTV-OTA/main/releases/canary-7.0.18/NeuralIPTVPlayer.nup >/dev/null
